version: '3.8'

services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./models:/models
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MODELS_DIR=/models
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq docker.io > /dev/null 2>&1 && 
             pip install -r requirements.txt -q && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend
